<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Panel</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <h1>Kitchen Panel</h1>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/waiter">Waiter Form</a>
      <a href="/stock">Stock</a>
    </div>
  </nav>

  <div class="container">
    <h2>Current Inventory</h2>
    <table border="1" style="width:100%; border-collapse:collapse; margin-top:20px;">
      <tr style="background-color:#f0f0f0;">
        <th>Table Number</th>
        <th>Order Details</th>
        <th>Priority</th>
        <th>Complete</th>
      </tr>
      {% for item in items %}
      <tr>
        <td>{{item[0]}}</td>
        <td>{{item[1]}}</td>
        <td>{{item[2]}}</td>
        <td><a href="/completed/{{item[0]}}">Complete</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>

</body>
</html>
